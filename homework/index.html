<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Student Portal | Tutoring Jedi</title>
  <link rel="icon" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../" aria-label="Tutoring Jedi home">
      <span class="b-white">Tutoring</span><span class="b-gold">Jedi</span><span class="b-ca">.ca</span>
      <span class="brand-sub">Student Portal</span>
    </a>
    <nav id="topnav" class="topnav" aria-label="Portal navigation"></nav>
  </header>

  <main id="app" class="app" aria-live="polite">
    <div class="loading">Loading…</div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="wrap">The Student Portal needs JavaScript turned on.</p></noscript>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>

</html>
